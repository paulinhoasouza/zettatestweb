<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="color-scheme" content="light dark" />
    <title>Zetta Propostas · ZettaMinds</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Aparência antes do primeiro desenho (evita piscar): "auto" segue o sistema. -->
    <script>
      (function () {
        try {
          var e = localStorage.getItem('zp-aparencia') || 'auto'
          var escuro = e === 'escura' || (e === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro'
          document.documentElement.style.colorScheme = escuro ? 'dark' : 'light'
        } catch (_) { document.documentElement.dataset.tema = 'claro' }
      })()
    </script>
    <!-- SF Pro é a fonte do sistema no Apple; nos outros, Inter é a mais próxima. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
